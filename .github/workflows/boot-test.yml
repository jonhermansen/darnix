name: Boot Test

on:
  push:
    branches: [main, nix]
  workflow_dispatch:

concurrency:
  group: boot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            system: aarch64-darwin
          - arch: x86_64
            runner: macos-26-intel
            system: x86_64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      R2_STORE: s3://darnix-private?endpoint=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com&region=auto
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # The nix daemon runs as root and needs R2 credentials for substitution.
      - name: Configure R2 credentials
        run: |
          sudo mkdir -p /var/root/.aws
          printf '[default]\naws_access_key_id = %s\naws_secret_access_key = %s\n' \
            '${{ secrets.R2_ACCESS_KEY_ID }}' '${{ secrets.R2_SECRET_ACCESS_KEY }}' \
            | sudo tee /var/root/.aws/credentials > /dev/null
          sudo chmod 600 /var/root/.aws/credentials

      # cachix/install-nix-action supports x86_64-darwin;
      # DeterminateSystems/nix-installer-action dropped it.
      - uses: cachix/install-nix-action@875018fe555aee647c21ea81888659240cd8e27b
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.R2_STORE }}
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= ${{ vars.NIX_CACHE_PUBLIC_KEY }}
            post-build-hook = /tmp/post-build-hook.sh
            connect-timeout = 60

      # Written after nix install so we can resolve the absolute path to nix.
      # The daemon runs hooks in a minimal environment without PATH.
      - name: Write post-build-hook
        env:
          NIX_CACHE_SECRET_KEY: ${{ secrets.NIX_CACHE_SECRET_KEY }}
        run: |
          echo "$NIX_CACHE_SECRET_KEY" > /tmp/nix-cache-key.sec
          chmod 600 /tmp/nix-cache-key.sec

          NIX="$(which nix)"
          cat > /tmp/post-build-hook.sh <<EOF
          #!/bin/bash
          set -eu
          export AWS_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}"
          exec >> /tmp/post-build-hook.log 2>&1
          echo "=== hook: \$OUT_PATHS ==="
          $NIX store sign --key-file /tmp/nix-cache-key.sec \$OUT_PATHS
          $NIX copy --to "${{ env.R2_STORE }}" \$OUT_PATHS
          EOF
          chmod +x /tmp/post-build-hook.sh

      - name: Runner diagnostics
        run: |
          echo "=== CPU / Architecture ==="
          uname -a
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.optional.arm64 2>/dev/null && echo "ARM64 support: yes" || echo "ARM64 support: no"
          echo "=== Hardware ==="
          system_profiler SPHardwareDataType 2>/dev/null | grep -E 'Model|Chip|Processor|Cores|Memory'
          echo "=== Virtualization ==="
          sysctl -n kern.hv_support 2>/dev/null && echo "HV framework: yes" || echo "HV framework: no"
          echo "=== Disk ==="
          df -h / | tail -1
          echo "=== Rosetta ==="
          pgrep -x oahd > /dev/null && echo "oahd running (Rosetta active)" || echo "oahd not running"

      - name: Build
        run: |
          nix build .#packages.${{ matrix.system }}.run-arm64 --print-out-paths
          nix build .#packages.${{ matrix.system }}.run-x86_64 --print-out-paths

      - name: Post-build-hook log
        if: always()
        run: cat /tmp/post-build-hook.log 2>/dev/null || echo "no hook log"

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/nix-cache-key.sec /tmp/post-build-hook.sh
          sudo rm -f /var/root/.aws/credentials

  boot-test:
    needs: build
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
          - arch: x86_64
    env:
      R2_STORE: s3://darnix-private?endpoint=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com&region=auto
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Configure R2 credentials
        run: |
          sudo mkdir -p /var/root/.aws
          printf '[default]\naws_access_key_id = %s\naws_secret_access_key = %s\n' \
            '${{ secrets.R2_ACCESS_KEY_ID }}' '${{ secrets.R2_SECRET_ACCESS_KEY }}' \
            | sudo tee /var/root/.aws/credentials > /dev/null
          sudo chmod 600 /var/root/.aws/credentials

      - uses: cachix/install-nix-action@875018fe555aee647c21ea81888659240cd8e27b
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.R2_STORE }}
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= ${{ vars.NIX_CACHE_PUBLIC_KEY }}
            connect-timeout = 60

      - name: Boot test
        run: nix run .#packages.aarch64-darwin.test-boot-${{ matrix.arch }}

      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/darnix-artifacts
          cp /tmp/darnix-boot-*.txt /tmp/darnix-artifacts/ 2>/dev/null || true
          log show --last 10m --predicate 'process == "qemu-system-x86_64" || process == "qemu-system-aarch64" || process == "sandboxd" || eventMessage contains "qemu"' \
            > /tmp/darnix-artifacts/system-log.txt 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-${{ matrix.arch }}
          path: /tmp/darnix-artifacts/

      - name: Cleanup
        if: always()
        run: sudo rm -f /var/root/.aws/credentials
