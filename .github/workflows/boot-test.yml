name: Boot Test

on:
  push:
    branches: [main, nix]
  workflow_dispatch:

concurrency:
  group: boot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            system: aarch64-darwin
          - arch: x86_64
            runner: macos-26-intel
            system: x86_64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      R2_STORE: s3://darnix-private?endpoint=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com&region=auto
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # The nix daemon runs as root and needs R2 credentials for substitution.
      - name: Configure R2 credentials
        run: |
          sudo mkdir -p /var/root/.aws
          printf '[default]\naws_access_key_id = %s\naws_secret_access_key = %s\n' \
            '${{ secrets.R2_ACCESS_KEY_ID }}' '${{ secrets.R2_SECRET_ACCESS_KEY }}' \
            | sudo tee /var/root/.aws/credentials > /dev/null
          sudo chmod 600 /var/root/.aws/credentials

      # cachix/install-nix-action supports x86_64-darwin;
      # DeterminateSystems/nix-installer-action dropped it.
      - uses: cachix/install-nix-action@875018fe555aee647c21ea81888659240cd8e27b
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.R2_STORE }}
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= ${{ vars.NIX_CACHE_PUBLIC_KEY }}
            post-build-hook = /tmp/post-build-hook.sh
            connect-timeout = 60

      # Written after nix install so we can resolve the absolute path to nix.
      # The daemon runs hooks in a minimal environment without PATH.
      - name: Write post-build-hook
        env:
          NIX_CACHE_SECRET_KEY: ${{ secrets.NIX_CACHE_SECRET_KEY }}
        run: |
          echo "$NIX_CACHE_SECRET_KEY" > /tmp/nix-cache-key.sec
          chmod 600 /tmp/nix-cache-key.sec

          NIX="$(which nix)"
          cat > /tmp/post-build-hook.sh <<EOF
          #!/bin/bash
          set -eu
          export AWS_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}"
          $NIX store sign --key-file /tmp/nix-cache-key.sec \$OUT_PATHS
          $NIX copy --no-recursive --to "${{ env.R2_STORE }}" \$OUT_PATHS
          EOF
          chmod +x /tmp/post-build-hook.sh

      - name: Build
        run: nix build .#packages.${{ matrix.system }}.run-${{ matrix.arch }} --print-out-paths

      - name: Boot test
        run: nix run .#packages.${{ matrix.system }}.test-boot-${{ matrix.arch }}

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-${{ matrix.arch }}
          path: /tmp/darnix-boot-*.txt

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/nix-cache-key.sec /tmp/post-build-hook.sh
          sudo rm -f /var/root/.aws/credentials
