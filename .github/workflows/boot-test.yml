name: Boot Test

on:
  push:
    branches: [main, nix]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: boot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            accel: hvf
          - runner: macos-15
            arch: x86_64
            accel: tcg
          - runner: macos-13
            arch: x86_64
            accel: hvf
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Build
        run: nix build .#packages.aarch64-darwin.run-${{ matrix.arch }} --print-out-paths

      - name: Boot test
        run: nix run .#packages.aarch64-darwin.test-boot-${{ matrix.arch }}

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-${{ matrix.arch }}-${{ matrix.runner }}
          path: /tmp/darnix-boot-*.txt
